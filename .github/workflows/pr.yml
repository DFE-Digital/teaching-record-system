name: Pull request build

on:
  pull_request:
    branches:
      - "*"
  merge_group:
    branches:
      - main

permissions:
  checks: write
  deployments: write
  packages: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # Pinned at v4.0.0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install tools
        run: just install-tools

      - name: Lint
        run: dotnet format --verify-no-changes --exclude src/TeachingRecordSystem.Core/DataStore/Postgres/Migrations

  validate_terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.5

      - name: Check formatting
        run: terraform fmt -check -diff
        working-directory: terraform/aks

      - name: Download terraform modules
        run: make ci dev vendor-modules

      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate -no-color
        working-directory: terraform/aks

      - name: Lint
        uses: reviewdog/action-tflint@54a5e5aed57dcfbb4662ec548de876df33d6288d # Pinned at v1.25.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tflint_rulesets: azurerm
          working_directory: terraform/aks
        continue-on-error: true # temporary- we're getting sporadic 503 errors here in action setup

  get_affected_projects:
    name: Get affected projects
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.get_test_projects.outputs.matrix }}
      projects: ${{ steps.get_test_projects.outputs.projects }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # Pinned at v4.0.0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install tools
        run: just install-tools

      - name: Get test projects
        id: get_test_projects
        run: |
          set -eo pipefail

          TARGET_BRANCH=main
          git fetch origin $TARGET_BRANCH --quiet

          projects=$(dotnet run scripts/GetTestProjectsToRun.cs -- origin/$TARGET_BRANCH | sed 's/^TeachingRecordSystem.//')

          # Split long-running projects over several jobs, so the slowest project doesn't decide how long a
          # PR takes to go green. The shard count comes from how many tests a project has, so suites that
          # grow get more shards on their own - there is no per-project list here to keep up to date.
          #
          # MS_PER_TEST are measured averages per [Fact]/[Theory]: browser-driven tests cost far more each
          # than the rest. TARGET_SHARD_SECONDS is deliberately close to the per-job build time - shards much
          # shorter than that spend more time building than testing.
          TARGET_SHARD_SECONDS=90
          MAX_SHARDS=6

          matrix='[]'

          for project in $projects; do
            tests=$(grep -rhoE --include='*.cs' '\[(Fact|Theory)' "tests/TeachingRecordSystem.$project" | wc -l | tr -d ' ')

            case "$project" in
              *EndToEndTests) ms_per_test=1350 ;;
              *) ms_per_test=80 ;;
            esac

            shards=$(( (tests * ms_per_test / 1000 + TARGET_SHARD_SECONDS - 1) / TARGET_SHARD_SECONDS ))
            [ "$shards" -lt 1 ] && shards=1
            [ "$shards" -gt "$MAX_SHARDS" ] && shards=$MAX_SHARDS

            echo "$project: $tests tests -> $shards shard(s)"

            matrix=$(jq -c --arg p "$project" --argjson n "$shards" \
              '. + [range(1; $n + 1) | { project: $p, shard: ., shards: $n }]' <<<"$matrix")
          done

          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "projects=$(jq -c 'map(.project) | unique' <<<"$matrix")" >> $GITHUB_OUTPUT

  tests:
    name: Tests (${{ matrix.entry.project }}${{ matrix.entry.shards > 1 && format(' {0}/{1}', matrix.entry.shard, matrix.entry.shards) || '' }})
    runs-on: ubuntu-latest
    needs: [get_affected_projects]
    if: needs.get_affected_projects.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.get_affected_projects.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # Pinned at v4.0.0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install tools
        run: just install-tools

      - name: Restore cached packages
        id: cache-packages-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/.librarymanager/cache
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/libman.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: just restore

      - name: Cache restored packages
        id: cache-packages-save
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/.librarymanager/cache
          key: ${{ steps.cache-packages-restore.outputs.cache-primary-key }}
        if: steps.cache-packages-restore.outputs.cache-hit != 'true'

      - name: Build project
        run: dotnet build -c Release --no-restore
        working-directory: tests/TeachingRecordSystem.${{ matrix.entry.project }}

      - name: Cache Playwright browsers
        if: endsWith(matrix.project_short_name, 'EndToEndTests')
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright if required
        if: endsWith(matrix.entry.project, 'EndToEndTests')
        run: pwsh ./bin/Release/net10.0/playwright.ps1 install chromium
        working-directory: tests/TeachingRecordSystem.${{ matrix.entry.project }}
        env:
          PROJECT_NAME: ${{ matrix.entry.project }}

      - name: Work out which classes this shard runs
        if: matrix.entry.shards > 1
        id: shard
        run: |
          set -eo pipefail

          # Balance on the number of tests in each class rather than on class count, so one large class
          # doesn't leave a shard with far more work than its siblings. Classes are fed in descending size
          # order and each goes to whichever shard is currently lightest.
          classes=$(./bin/Release/net10.0/TeachingRecordSystem.${{ matrix.entry.project }} -list methods/json \
            | head -1 \
            | jq -r '.[] | sub("\\.[^.]+$"; "")' \
            | sort | uniq -c | sort -rn | awk '{ print $2, $1 }')

          # Also emits the number of test methods in this shard, which is a valid lower bound on the number
          # of tests it should run - a [Theory] expands to at least one. Passing that as
          # --minimum-expected-tests turns "the filter matched nothing" into a failure rather than a green
          # run of zero tests.
          read -r methods filter < <(awk -v shards=${{ matrix.entry.shards }} -v me=${{ matrix.entry.shard }} '
            { cls[NR] = $1; count[NR] = $2 }
            END {
              for (s = 1; s <= shards; s++) load[s] = 0

              for (i = 1; i <= NR; i++) {
                lightest = 1
                for (s = 2; s <= shards; s++) if (load[s] < load[lightest]) lightest = s
                load[lightest] += count[i]
                if (lightest == me) { mine = mine " " cls[i]; methods += count[i] }
              }

              print methods mine
            }' <<<"$classes")

          if [ -z "$filter" ] || [ "${methods:-0}" -lt 1 ]; then
            echo "::error::Shard ${{ matrix.entry.shard }} of ${{ matrix.entry.shards }} matched no test classes" >&2
            exit 1
          fi

          echo "This shard runs $methods test methods across $(wc -w <<<"$filter") classes"
          echo "filter=--filter-class $filter --minimum-expected-tests $methods" >> $GITHUB_OUTPUT
        working-directory: tests/TeachingRecordSystem.${{ matrix.entry.project }}

      - name: Run tests
        uses: ./.github/workflows/actions/test
        with:
          test_project_path: tests/TeachingRecordSystem.${{ matrix.entry.project }}
          dotnet_test_args: >-
            --no-build ${{ steps.shard.outputs.filter }}
        timeout-minutes: 30

      - name: Keep the results for the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.entry.project }}-${{ matrix.entry.shard }}
          path: tests/TeachingRecordSystem.${{ matrix.entry.project }}/**/*.trx
          # A job that fell over before running any tests has nothing to upload; the failure itself is the
          # signal, so don't add a second, more confusing one on top of it.
          if-no-files-found: warn
          retention-days: 7

  report_test_results:
    name: Test results (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [get_affected_projects, tests]
    if: always() && needs.get_affected_projects.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.get_affected_projects.outputs.projects) }}

    steps:
      - uses: actions/checkout@v7

      # Every shard of a project lands in one report, so a project that is split over several jobs still
      # reads as a single set of results.
      - uses: actions/download-artifact@v8
        with:
          pattern: test-results-${{ matrix.project }}-*
          merge-multiple: true
          path: results

      - uses: dorny/test-reporter@v3
        with:
          name: ${{ matrix.project }} test results
          path: "results/**/*.trx"
          reporter: dotnet-trx
          # A project whose jobs fell over before running any tests has no .trx to report on; the failure
          # itself is the signal, so don't add a second, more confusing one on top of it.
          fail-on-empty: false

  check_test_results:
    name: Check test results
    runs-on: ubuntu-latest
    needs: [tests]
    if: always()
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const testsStepResult = '${{ needs.tests.result }}';

            if (testsStepResult === 'failure') {
              core.setFailed('Required tests failed.');
            }

  package:
    name: Package application
    uses: ./.github/workflows/package.yml
    secrets: inherit
