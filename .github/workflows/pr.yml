name: Pull request build

on:
  pull_request:
    branches:
      - "*"
  merge_group:
    branches:
      - main

permissions:
  checks: write
  deployments: write
  packages: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # Pinned at v4.0.0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install tools
        run: just install-tools

      - name: Lint
        run: dotnet format --verify-no-changes --exclude src/TeachingRecordSystem.Core/DataStore/Postgres/Migrations

  validate_terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.5

      - name: Check formatting
        run: terraform fmt -check -diff
        working-directory: terraform/aks

      - name: Download terraform modules
        run: make ci dev vendor-modules

      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate -no-color
        working-directory: terraform/aks

  get_affected_projects:
    name: Get affected projects
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.get_test_projects.outputs.matrix }}
      projects: ${{ steps.get_test_projects.outputs.projects }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # Pinned at v4.0.0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install tools
        run: just install-tools

      - name: Get test projects
        id: get_test_projects
        run: |
          set -eo pipefail

          TARGET_BRANCH=main
          git fetch origin $TARGET_BRANCH --quiet

          dotnet build scripts/GetTestProjectsToRun.cs
          projects=$(dotnet run --no-build scripts/GetTestProjectsToRun.cs -- origin/$TARGET_BRANCH | sed 's/^TeachingRecordSystem.//')

          # Split long-running projects over several jobs, so the slowest project doesn't decide how long a
          # PR takes to go green. The shard count comes from how long a project's tests have taken, so suites
          # that grow get more shards on their own - there is no per-project list here to keep up to date.
          #
          # Each job also runs its tests across several processes, as many as the runner has cores. That
          # doesn't work for EndToEndTests since its hosts listen on fixed ports.
          # Jobs share one build, so another shard only costs its setup, which is about 20 seconds.
          TARGET_SHARD_SECONDS=30
          MAX_SHARDS=6
          PROCESSES_PER_JOB=4

          matrix='[]'

          for project in $projects; do
            seconds=$(jq --arg p "$project" '[(.[$p] // {})[]] | add // 0 | ceil' tests/test-timings.json)

            case "$project" in
              *EndToEndTests) processes=1 ;;
              *) processes=$PROCESSES_PER_JOB ;;
            esac

            shards=$(( (seconds / processes + TARGET_SHARD_SECONDS - 1) / TARGET_SHARD_SECONDS ))
            [ "$shards" -lt 1 ] && shards=1
            [ "$shards" -gt "$MAX_SHARDS" ] && shards=$MAX_SHARDS

            echo "$project: ${seconds}s of tests -> $shards shard(s)"

            matrix=$(jq -c --arg p "$project" --argjson n "$shards" --argjson processes "$processes" \
              '. + [range(1; $n + 1) | { project: $p, shard: ., shards: $n, processes: $processes }]' <<<"$matrix")
          done

          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "projects=$(jq -c 'map(.project) | unique' <<<"$matrix")" >> $GITHUB_OUTPUT

  # Runs alongside get_affected_projects, so this builds everything rather than what a change affects. Every test job
  # shares the output. Analyzers are half of the build, so they're left to the analyze job, which runs alongside the tests.
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore cached packages
        id: cache-packages-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/.librarymanager/cache
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/libman.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Cache restored packages
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/.librarymanager/cache
          key: ${{ steps.cache-packages-restore.outputs.cache-primary-key }}
        if: steps.cache-packages-restore.outputs.cache-hit != 'true'

      - name: Build
        run: dotnet build -c Release --no-restore -p:RunAnalyzers=false

      # The job doesn't finish for another 50 seconds or so if these are left for the runner to clean up
      - name: Stop build servers
        run: dotnet build-server shutdown

      - name: Build test runner
        run: dotnet build scripts/RunTests.cs -c Release -o .run-tests

      # Everything the build generated other than what's already in the test projects' output, since tests also read
      # generated assets from src. Paths in the output are absolute, which is fine as every job uses the same workspace.
      #
      # All the test jobs download this at once, and the slowest of them holds up the run, so its size matters. The test
      # projects mostly contain the same files; ordering by file name puts the copies within zstd's window.
      - name: Pack build output
        run: |
          git ls-files --others --ignored --exclude-standard -- src tests \
            | grep -vE '^src/[^/]+/bin/|^tests/[^/]+/obj/' \
            | awk -F/ '{ print $NF "/" $0 }' | sort | cut -d/ -f2- > build-output-files
          tar -I 'zstd -T0 --long=27' -cf build-output.tar.zst -T build-output-files .run-tests
          ls -l build-output.tar.zst

      - name: Keep the build output for the test jobs
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: build-output.tar.zst
          compression-level: 0
          retention-days: 3

  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore cached packages
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/.librarymanager/cache
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/libman.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Stop build servers
        run: dotnet build-server shutdown

  tests:
    name: Tests (${{ matrix.entry.project }}${{ matrix.entry.shards > 1 && format(' {0}/{1}', matrix.entry.shard, matrix.entry.shards) || '' }})
    runs-on: ubuntu-latest
    needs: [get_affected_projects, build]
    if: needs.get_affected_projects.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.get_affected_projects.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      # Runs in the background during setup; if it's still going, the tests wait for the same pull
      - name: Start pulling the Postgres image
        run: nohup docker pull postgres:17 > /dev/null 2>&1 &

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Unpack build output
        run: tar -I zstd -xf build-output.tar.zst && rm build-output.tar.zst

      - name: Cache Playwright browsers
        if: endsWith(matrix.entry.project, 'EndToEndTests')
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright if required
        if: endsWith(matrix.entry.project, 'EndToEndTests')
        run: pwsh ./bin/Release/net11.0/playwright.ps1 install chromium
        working-directory: tests/TeachingRecordSystem.${{ matrix.entry.project }}
        env:
          PROJECT_NAME: ${{ matrix.entry.project }}

      # The CLI's first-run setup fails if several processes try to do it at once
      - name: Run the .NET CLI's first-run setup
        run: dotnet tool list

      - name: Run tests
        run: >-
          .run-tests/RunTests
          ${{ matrix.entry.project }}
          --configuration Release
          --shard ${{ matrix.entry.shard }}
          --shards ${{ matrix.entry.shards }}
          --processes ${{ matrix.entry.processes }}
        env:
          # The runner is thrown away after the job, so nothing needs cleaning up after the test containers
          TESTCONTAINERS_RYUK_DISABLED: true
        timeout-minutes: 30

      - name: Keep the results for the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.entry.project }}-${{ matrix.entry.shard }}
          path: tests/TeachingRecordSystem.${{ matrix.entry.project }}/**/*.trx
          # A job that fell over before running any tests has nothing to upload; the failure itself is the
          # signal, so don't add a second, more confusing one on top of it.
          if-no-files-found: warn
          retention-days: 7

  report_test_results:
    name: Test results (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [get_affected_projects, tests]
    if: always() && needs.get_affected_projects.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.get_affected_projects.outputs.projects) }}

    steps:
      - uses: actions/checkout@v7

      # Every shard of a project lands in one report, so a project that is split over several jobs still
      # reads as a single set of results.
      - uses: actions/download-artifact@v8
        with:
          pattern: test-results-${{ matrix.project }}-*
          merge-multiple: true
          path: results

      - uses: dorny/test-reporter@v3
        with:
          name: ${{ matrix.project }} test results
          path: "results/**/*.trx"
          reporter: dotnet-trx
          # A project whose jobs fell over before running any tests has no .trx to report on; the failure
          # itself is the signal, so don't add a second, more confusing one on top of it.
          fail-on-empty: false

  check_test_results:
    name: Check test results
    runs-on: ubuntu-latest
    needs: [build, analyze, tests]
    if: always()
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // The tests are skipped, not failed, when the build fails
            if (${{ contains(needs.*.result, 'failure') }}) {
              core.setFailed('Required tests failed.');
            }

  package:
    name: Package application
    uses: ./.github/workflows/package.yml
    secrets: inherit
